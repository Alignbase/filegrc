name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Update npm
        run: npm install --global npm@11.21.0

      - name: Install from lockfile
        run: npm ci

      - name: Validate clean install
        run: npm run validate
        env:
          CI: true

      - name: Require generated files to be current
        run: git diff --exit-code

      - name: Check package contents
        run: |
          npm pack --dry-run --workspace filegrc
          npm pack --dry-run --workspace create-filegrc

  compatibility:
    name: compatibility-${{ matrix.os }}-node-${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '20'
          - os: ubuntu-latest
            node: '22'
          - os: macos-latest
            node: '24'
          - os: windows-latest
            node: '24'
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install from lockfile
        run: npm ci

      - name: Run compatibility tests
        if: runner.os != 'Windows'
        run: npm run validate:fast
        env:
          CI: true

      - name: Run Windows smoke tests
        if: runner.os == 'Windows'
        run: |
          node --test packages/filegrc/test/id.test.js packages/filegrc/test/time.test.js scripts/verify-release.test.mjs scripts/alert-failed-jobs.test.mjs
          node packages/filegrc/bin/filegrc.js --help
          node packages/create-filegrc/bin/create-filegrc.js --help

  notify-failure:
    name: Notify Slack of failure
    needs: [clean-install, compatibility]
    if: ${{ !cancelled() && contains(needs.*.result, 'failure') && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Send failed jobs to Slack
        run: |
          test -n "$SLACK_WEBHOOK_URL"
          failed_jobs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out") | "• \(.name): \(.html_url)"' | \
            jq -R -r -s 'split("\n") | map(select(length > 0)) | join("\n")')
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          message="<!channel> FileGRC validation failed: $run_url"
          if [ -n "$failed_jobs" ]; then
            message="$message"$'\n'"$failed_jobs"
          fi
          jq -n --arg text "$message" '{text: $text}' | \
            curl --fail --silent --show-error --retry 3 \
              --header 'Content-Type: application/json' \
              --data-binary @- "$SLACK_WEBHOOK_URL" >/dev/null
