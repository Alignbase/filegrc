name: Diagnose release validation
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0

      - name: Verify protected release source
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          export GITHUB_REF="refs/tags/${RELEASE_TAG}"
          git fetch --no-tags origin main
          git show FETCH_HEAD:scripts/verify-release.mjs > "${RUNNER_TEMP}/verify-release.mjs"
          node "${RUNNER_TEMP}/verify-release.mjs"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Update npm
        run: npm install --global npm@11.21.1

      - name: Install dependencies
        run: npm ci

      - name: Diagnose release Git tests
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          CI: true
        run: |
          export GITHUB_REF="refs/tags/${RELEASE_TAG}"
          export GITHUB_REF_TYPE=tag
          node --version
          git --version
          git symbolic-ref -q HEAD || true
          node --input-type=module <<'JS'
          import { readFile, writeFile } from 'node:fs/promises';
          import { resolve } from 'node:path';
          import { runTestSuite } from './scripts/test-scheduler.mjs';
          const path = 'scripts/test-shard-worker.mjs';
          const source = await readFile(path, 'utf8');
          await writeFile(path, source.replace('stream.on("test:fail", (data) => record(data, false));', 'stream.on("test:fail", (data) => { record(data, false); console.error(data.details?.error); });'));
          JS
          npm run validate
