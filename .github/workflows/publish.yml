name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Update npm
        run: npm install --global npm@11.16.0

      - name: Install dependencies
        run: npm ci

      - name: Run validation
        run: npm run validate
        env:
          CI: true

      - name: Check package contents
        run: |
          npm pack --dry-run --workspace filegrc
          npm pack --dry-run --workspace create-filegrc

      - name: Verify npm trusted publishing
        run: |
          node --input-type=module <<'NODE'
          const audience = "npm:registry.npmjs.org";
          const requestUrl = process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
          const requestToken = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
          if (!requestUrl || !requestToken) {
            throw new Error("GitHub did not provide an OIDC token request endpoint.");
          }

          const separator = requestUrl.includes("?") ? "&" : "?";
          const identityResponse = await fetch(
            `${requestUrl}${separator}audience=${encodeURIComponent(audience)}`,
            { headers: { Authorization: `bearer ${requestToken}` } }
          );
          if (!identityResponse.ok) {
            throw new Error(`GitHub OIDC request failed (${identityResponse.status}).`);
          }
          const { value: identityToken } = await identityResponse.json();
          if (!identityToken) throw new Error("GitHub OIDC response did not include an identity token.");

          const failures = [];
          for (const packageName of ["filegrc", "create-filegrc"]) {
            const exchangeResponse = await fetch(
              `https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${encodeURIComponent(packageName)}`,
              {
                method: "POST",
                headers: { Authorization: `Bearer ${identityToken}` }
              }
            );
            if (!exchangeResponse.ok) {
              const detail = await exchangeResponse.text();
              failures.push(`${packageName} (${exchangeResponse.status}): ${detail}`);
              continue;
            }
            const exchange = await exchangeResponse.json();
            if (exchange.token_type !== "oidc" || !exchange.token || !exchange.expires) {
              failures.push(`${packageName}: npm returned an invalid OIDC exchange.`);
              continue;
            }
            console.log(`${packageName}: npm trusted publishing verified until ${exchange.expires}.`);
          }

          if (failures.length > 0) {
            throw new Error(`npm OIDC exchange failed:\n${failures.join("\n")}`);
          }
          NODE

      - name: Publish packages
        run: |
          set -euo pipefail

          for package in filegrc create-filegrc; do
            version="$(node -p "require('./packages/${package}/package.json').version")"
            if [ "$(npm view "${package}@${version}" version 2>/dev/null || true)" = "${version}" ]; then
              echo "${package}@${version} is already published."
              continue
            fi

            npm publish --workspace "${package}" --access public --provenance
          done

      - name: Verify README setup
        run: |
          set -euo pipefail

          smoke_dir="$(mktemp -d)"
          server_pid=""
          cleanup() {
            if [ -n "${server_pid}" ]; then
              kill "${server_pid}" 2>/dev/null || true
              wait "${server_pid}" 2>/dev/null || true
            fi
            rm -rf "${smoke_dir}"
          }
          trap cleanup EXIT

          create_version="$(node -p "require('./packages/create-filegrc/package.json').version")"
          for package in filegrc create-filegrc; do
            version="$(node -p "require('./packages/${package}/package.json').version")"
            available=false
            for _ in {1..12}; do
              if [ "$(npm view "${package}@${version}" version 2>/dev/null || true)" = "${version}" ]; then
                available=true
                break
              fi
              sleep 5
            done
            if [ "${available}" != "true" ]; then
              echo "${package}@${version} did not become available from npm."
              exit 1
            fi
          done

          cd "${smoke_dir}"
          npx --yes "create-filegrc@${create_version}" company-grc --yes
          cd company-grc
          npm run validate

          npm run serve >server.log 2>&1 &
          server_pid="$!"
          ready=false
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8787/ >/dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "${server_pid}" 2>/dev/null; then
              cat server.log
              exit 1
            fi
            sleep 1
          done

          if [ "${ready}" != "true" ]; then
            cat server.log
            exit 1
          fi
